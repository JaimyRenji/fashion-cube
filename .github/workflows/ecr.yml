name: Docker Build and Push to ECR - Main

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: demo
  AWS_ACCOUNT_ID: "406194433052"

jobs:

  # JOB 1: Build Docker image and push to ECR

  build-and-push:

    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-${{ github.sha }}

  # JOB 2: Deploy image from ECR to EC2

  deploy-to-ec2:

    name: Deploy to EC2

    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify EC2 and SSM instance
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          echo "Checking AWS identity"
          aws sts get-caller-identity

          echo "Checking EC2 instance"
          aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Reservations[].Instances[].{ID:InstanceId,State:State.Name,Region:Placement.AvailabilityZone}" \
            --output table

          echo "Checking SSM registration"
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --output table
      - name: Deploy Docker image to EC2 using SSM
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: frontend-${{ github.sha }}
        run: |

          set -euo pipefail

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Deploying image: ${IMAGE_URI}"

          REMOTE_SCRIPT=$(cat <<EOF
          set -e

          echo "Logging in to ECR"

          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}

          echo "Pulling new Docker image"

          docker pull ${IMAGE_URI}

          echo "Stopping old container if it exists"

          docker rm -f fashion-cube-frontend || true

          echo "Starting new container"

          docker run -d \
            --name fashion-cube-frontend \
            --restart unless-stopped \
            -p 80:80 \
            ${IMAGE_URI}

          echo "Waiting for application to start"

          sleep 5

          echo "Checking application health"

          curl -fsS http://localhost/ > /dev/null

          echo "Deployment successful"

          docker ps

          EOF
          )

          PARAMETERS=$(jq -n --arg script "$REMOTE_SCRIPT" '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "Deploy Fashion Cube frontend" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              break
            fi

            sleep 5

          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed"
            exit 1
          fi
